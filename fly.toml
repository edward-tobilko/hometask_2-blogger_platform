app = 'hometask-2-blogger-platform'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = "node ./node_modules/typeorm/cli.js migration:run -d dist/db/data-source.js"